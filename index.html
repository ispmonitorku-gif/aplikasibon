<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Aplikasi Bon Tim BK1172AFR</title>
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            --surface: #ffffff;
            --bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-card: 24px;
            --radius-input: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }

        .app-container { width: 100%; max-width: 480px; position: relative; padding-bottom: 100px; }

        /* Header Ringan */
        .header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 20px 20px 16px;
            position: sticky; top: 0; z-index: 10;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            display: flex; align-items: center; gap: 14px;
        }
        .header-icon {
            width: 42px; height: 42px; border-radius: 12px;
            background: var(--primary-gradient);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .header-text h1 { font-size: 18px; font-weight: 700; color: var(--text-main); letter-spacing: -0.3px; }
        .header-text p { font-size: 13px; color: var(--text-muted); font-weight: 500; }

        .form-content { padding: 16px 20px; }

        .card {
            background: var(--surface); border-radius: var(--radius-card); padding: 24px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 18px;
        }

        /* Input Fields */
        .input-group { position: relative; }
        
        .input-group input, .input-group select, .input-group textarea {
            width: 100%; padding: 16px 14px; font-size: 15px; font-weight: 500;
            border: 1.5px solid var(--border); border-radius: var(--radius-input);
            background: var(--surface); outline: none; transition: all 0.2s ease; color: var(--text-main);
        }

        .input-group select { appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M6 9L12 15L18 9' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 14px center; }
        .input-group textarea { resize: vertical; min-height: 80px; }

        .input-group label {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            background: var(--surface); color: var(--text-muted); font-size: 14px; font-weight: 500;
            transition: 0.2s ease all; pointer-events: none; padding: 0 4px; margin-top: -1px;
        }
        .input-group textarea ~ label { top: 24px; }

        .input-group input:focus, .input-group input:not(:placeholder-shown),
        .input-group textarea:focus, .input-group textarea:not(:placeholder-shown),
        .input-group select:focus, .input-group select:valid { border-color: var(--primary); }

        .input-group input:focus ~ label, .input-group input:not(:placeholder-shown) ~ label,
        .input-group textarea:focus ~ label, .input-group textarea:not(:placeholder-shown) ~ label,
        .input-group select:focus ~ label, .input-group select:valid ~ label {
            top: 0; font-size: 12px; color: var(--primary); font-weight: 700;
        }

        /* Area Upload Foto - Kamera & Galeri */
        .file-upload {
            border: 2px dashed #cbd5e1; border-radius: var(--radius-input); background: #f8fafc;
            padding: 28px 16px; text-align: center; position: relative; cursor: pointer; transition: all 0.2s ease;
            overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .file-upload input[type="file"] { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; z-index: 2; }
        .file-icon { font-size: 36px; margin-bottom: 8px; transition: 0.3s; }
        .file-text { font-size: 14px; font-weight: 600; color: var(--text-main); }
        .file-subtext { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        
        #imagePreview {
            display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            object-fit: cover; z-index: 1; border-radius: calc(var(--radius-input) - 2px); opacity: 0.9;
        }

        /* Bottom Action Bar */
        .bottom-action {
            position: fixed; bottom: 0; left: 0; width: 100%;
            padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 -4px 24px rgba(0,0,0,0.06); display: flex; justify-content: center; z-index: 20;
        }

        .btn-submit {
            width: 100%; max-width: 440px; background: var(--primary-gradient); color: white;
            border: none; padding: 16px; border-radius: 100px; font-size: 16px; font-weight: 700;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25); cursor: pointer; transition: all 0.15s;
        }
        .btn-submit:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2); }

        /* Loader Ringan & Cepat (Lightweight Toast Style) */
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(2px);
            z-index: 100; display: none; justify-content: center; align-items: center;
        }
        .loader-card {
            background: white; padding: 20px 32px; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; gap: 12px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .spinner { width: 34px; height: 34px; border: 3px solid #f1f5f9; border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite; }
        .loader-text { font-size: 14px; font-weight: 700; color: var(--text-main); }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-icon">🚐</div>
            <div class="header-text">
                <h1>Bon Operasional</h1>
                <p>Kendaraan BK1172AFR</p>
            </div>
        </div>

        <div class="form-content">
            <form id="bonForm">
                <div class="card">
                    
                    <div class="input-group">
                        <input type="text" id="tanggal" placeholder=" " onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'" required>
                        <label>Tanggal Pelaksanaan</label>
                    </div>

                    <div class="input-group">
                        <select id="user" required>
                            <option value="" disabled selected hidden></option>
                            <option value="Deny Irawan">Deny Irawan</option>
                            <option value="Sasro Lumban Gaol">Sasro Lumban Gaol</option>
                            <option value="Ahmad Khaidir">Ahmad Khaidir</option>
                            <option value="Ahmad Hanafy MTD">Ahmad Hanafy MTD</option>
                            <option value="Nur Habibullah Arwi">Nur Habibullah Arwi</option>
                        </select>
                        <label>Nama Pengemudi</label>
                    </div>

                    <div class="input-group">
                        <textarea id="keperluan" placeholder=" " required></textarea>
                        <label>Detail Keperluan / Pekerjaan</label>
                    </div>

                    <div class="input-group">
                        <input type="text" id="tujuan" placeholder=" " required>
                        <label>Tujuan Lokasi</label>
                    </div>

                    <div class="input-group">
                        <select id="jenisBon" required>
                            <option value="" disabled selected hidden></option>
                            <option value="tol">Bon Jalan Tol</option>
                            <option value="parkir">Bon Parkir</option>
                            <option value="lainnya">Lain-lain</option>
                        </select>
                        <label>Jenis Bon</label>
                    </div>

                    <div class="input-group">
                        <input type="number" id="jumlah" placeholder=" " required>
                        <label>Total Biaya (Rp)</label>
                    </div>

                    <!-- Input File tanpa "capture" agar bisa pilih Galeri atau Kamera -->
                    <div class="file-upload" id="uploadArea">
                        <img id="imagePreview" alt="Preview">
                        <div class="file-icon" id="fileIcon">📸</div>
                        <div class="file-text" id="fileText">Kamera / Galeri HP</div>
                        <div class="file-subtext" id="fileSub">Ketuk untuk mengambil foto bon</div>
                        <!-- Atribut capture="environment" telah dihapus -->
                        <input type="file" id="fotoBon" accept="image/*" required>
                    </div>

                </div>
            </form>
        </div>

        <div class="bottom-action">
            <button type="submit" form="bonForm" class="btn-submit">
                Kirim Data Bon
            </button>
        </div>
    </div>

    <!-- Tampilan Loading Baru: Lebih Ringan & Modern -->
    <div class="loader-overlay" id="loader">
        <div class="loader-card">
            <div class="spinner"></div>
            <div class="loader-text">Menyimpan...</div>
        </div>
    </div>

    <script>
        // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx-OfzCFSKb4cHnsowXDVJV4TPhh7s9Qs_nFBpRqYxSuIAijp9rwO3x3iB2K-ZBMM4/exec";

        // Fitur Preview Gambar Instan
        document.getElementById('fotoBon').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    
                    document.getElementById('uploadArea').style.borderColor = "var(--primary)";
                    document.getElementById('fileIcon').style.opacity = '0';
                    document.getElementById('fileText').innerHTML = '<span style="background: rgba(255,255,255,0.9); padding: 4px 12px; border-radius: 20px; position: relative; z-index: 3; color: var(--primary);">✅ Foto Terpilih</span>';
                    document.getElementById('fileSub').style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        // Script Kompresi Gambar Cepat (Ringan)
        function compressImageFast(file, maxWidth, quality, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Proses Pengiriman Form
        document.getElementById('bonForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Tampilkan animasi loading ringan
            document.getElementById('loader').style.display = 'flex';

            const fileInput = document.getElementById('fotoBon').files[0];

            // Proses kompresi dan kirim
            compressImageFast(fileInput, 1024, 0.6, function(base64Image) {
                const payload = {
                    tanggal: document.getElementById('tanggal').value,
                    user: document.getElementById('user').value,
                    keperluan: document.getElementById('keperluan').value,
                    tujuan: document.getElementById('tujuan').value,
                    jenisBon: document.getElementById('jenisBon').value,
                    jumlah: document.getElementById('jumlah').value,
                    fotoBase64: base64Image,
                    fotoMimeType: 'image/jpeg'
                };

                fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loader').style.display = 'none';
                    if (data.status === "success") {
                        // Notifikasi simpel dari browser
                        alert('✅ Berhasil dikirim!');
                        
                        // Kembalikan form ke kondisi semula
                        document.getElementById('bonForm').reset();
                        document.getElementById('imagePreview').style.display = 'none';
                        document.getElementById('uploadArea').style.borderColor = "#cbd5e1";
                        document.getElementById('fileIcon').style.opacity = '1';
                        document.getElementById('fileText').innerHTML = 'Kamera / Galeri HP';
                        document.getElementById('fileSub').style.display = 'block';
                    } else {
                        alert('⚠️ Gagal: ' + data.message);
                    }
                })
                .catch(error => {
                    document.getElementById('loader').style.display = 'none';
                    alert('Terjadi kesalahan jaringan.');
                });
            });
        });
    </script>
</body>
</html>
